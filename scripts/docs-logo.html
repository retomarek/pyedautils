<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<!-- Jupyter Book sidebar logo (260×76 CSS px, rendered at 2x with a transparent corner background):
     a small dark tile, readable on the light and the dark theme. Rendered by
     scripts/render_branding.py into docs/images/logo-docs.png. -->
<style>
html,body{margin:0;width:260px;height:76px;overflow:hidden;background:transparent}
.tile{box-sizing:border-box;width:260px;height:76px;border-radius:18px;display:flex;align-items:center;gap:12px;padding:0 14px 0 10px;
  background:radial-gradient(120% 220% at 0% 0%,#1f3756 0%,#101b29 55%,#0a121c 100%);font-family:Manrope,sans-serif;color:#eef3f8}
.logo{width:56px;height:56px;flex:none}
.text{display:flex;flex-direction:column;gap:3px;min-width:0}
b{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1}
span{font-size:11.5px;font-weight:600;color:#b7c4d3;line-height:1.2;white-space:nowrap}
</style></head><body>
<div class="tile"><img class="logo" src="../docs/logo.svg" alt=""><div class="text"><b>pyedautils</b><span>Energy Data Analysis Utilities</span></div></div>
</body></html>
