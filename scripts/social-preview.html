<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap">
<!-- GitHub social preview (1280×640). Keep text inside the safe area (≈ 40 px margin all round,
     GitHub crops on some surfaces). Uses docs/logo.svg and docs/images/branding_*.png, all made by
     scripts/make_logo.py / scripts/render_branding.py. -->
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:radial-gradient(120% 140% at 0% 0%,#1f3756 0%,#101b29 55%,#0a121c 100%);font-family:Manrope,sans-serif;color:#eef3f8;position:relative}
.left{position:absolute;left:84px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.logo{width:132px;height:132px;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
h1{margin:0;font-size:72px;font-weight:800;letter-spacing:-1.5px;line-height:1}
p{margin:0;font-size:27px;line-height:1.38;color:#b7c4d3;font-weight:500;max-width:520px}
.chips{display:flex;gap:10px;flex-wrap:wrap;max-width:540px}
.chip{font-size:18px;font-weight:700;padding:7px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);color:#dfe8f1}
.chip.g{border-color:#9acd32;color:#c9f26f}.chip.o{border-color:#f08a2c;color:#f6b06c}.chip.b{border-color:#63c1ff;color:#a9dcff}.chip.y{border-color:#ffd43b;color:#ffe48a}
.shot{position:absolute;border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.55);background:#fff}
.s1{right:110px;top:36px;width:490px;transform:rotate(-3deg)}
.s2{right:24px;top:318px;width:270px;height:270px;transform:rotate(3deg)}
.crop{overflow:hidden}.crop img{width:140%;margin:-7% 0 0 -20%;display:block}
.s3{right:262px;top:342px;width:380px;transform:rotate(-1.5deg)}
</style></head><body>
<div class="left">
  <img class="logo" src="../docs/logo.svg">
  <h1>pyedautils</h1>
  <p>Python Energy Data Analysis Utilities for energy, comfort and weather time series.</p>
  <div class="chips"><span class="chip y">Energy signature</span><span class="chip g">Comfort &amp; Mollier h,x</span><span class="chip o">Degree days</span><span class="chip b">Weather data</span></div>
</div>
<img class="shot s1" src="../docs/images/branding_mollier_hx.png">
<img class="shot s3" src="../docs/images/branding_energy_signature.png">
<div class="shot s2 crop"><img src="../docs/images/branding_comfort_compass.png"></div>
</body></html>
